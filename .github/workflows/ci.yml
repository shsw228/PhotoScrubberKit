name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show selected Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      # Pick the newest available iPhone simulator so the workflow keeps working
      # as the runner image's installed runtimes change.
      - name: Select simulator
        id: sim
        run: |
          UDID="$(xcrun simctl list devices available --json \
            | python3 -c "import sys, json; d = json.load(sys.stdin)['devices']; cands = [dev['udid'] for rt in sorted(d) if 'iOS' in rt for dev in d[rt] if dev.get('isAvailable') and dev['name'].startswith('iPhone')]; print(cands[-1] if cands else '')")"
          if [ -z "$UDID" ]; then echo 'No iPhone simulator available'; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          xcodebuild test \
            -scheme PhotoScrubberKit \
            -destination "id=${{ steps.sim.outputs.udid }}"
